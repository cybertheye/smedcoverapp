# nginx: serving the SmedCover project page (put the map in the http {} block, the server in sites-enabled/).
# Assets are not content-hashed, so CSS/JS/HTML/data revalidate on every visit (ETag, a 304 when unchanged) and
# only pictures and fonts are cached for long — when you replace one, give it a new file name.

map $uri $sc_cache {
    default                                         "no-cache";
    ~*\.(?:webp|avif|png|jpe?g|ico|woff2)$          "public, max-age=2592000";
    ~*\.(?:webmanifest|txt)$                        "public, max-age=86400";
}

server {
    listen 80;
    listen [::]:80;
    server_name smedcover.example.com;          # ← the domain, once decided
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                                   # nginx ≥ 1.25.1; older: "listen 443 ssl http2;"
    server_name smedcover.example.com;

    ssl_certificate     /etc/nginx/ssl/smedcover.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/smedcover.example.com.key;

    root  /var/www/smedcover-page;              # a checkout of this repository
    index index.html;
    charset utf-8;

    include mime.types;
    types { image/avif avif; application/manifest+json webmanifest; }   # drop avif if your mime.types already has it

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;

    # With the ngx_brotli module (apt: libnginx-mod-brotli, or built in), add:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;

    add_header Cache-Control           $sc_cache always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000" always;   # once HTTPS is settled
    # The inline <script> in <head> is allowed by its hash; recompute it if you edit that script
    # (see README). Add the mirror's origin to connect-src once DL_HOST is set.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-3K4U9mT5hwyAfSM8Gx+EfRalzEqNn6SJBy7Up93+5Pw='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # don't serve the repository's own files
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(?:scripts|nginx)/ { deny all; }
    location ~* \.(?:md|mjs|sh|py)$ { deny all; }
}

