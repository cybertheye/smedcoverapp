<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Bebas Neue"; src: url("http://127.0.0.1:8740/assets/fonts/bebas-neue.woff2") format("woff2"); }
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0b11;color:#f5f5f7;font-family:-apple-system,"PingFang SC",sans-serif}
.g{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:40px 40px}
svg.b{position:absolute;top:0;right:0;width:560px;height:630px}
.dots{position:absolute;top:0;right:0;width:560px;height:630px;clip-path:polygon(34% 0,100% 0,100% 100%,8% 100%);background:radial-gradient(circle,rgba(11,11,17,.2) 1.7px,transparent 2.1px) 0 0/11px 11px;-webkit-mask-image:linear-gradient(200deg,transparent 30%,#000 85%)}
.l{position:absolute;left:64px;top:70px;width:600px}
.brand{display:flex;align-items:center;gap:12px;font:400 40px/1 "Bebas Neue";letter-spacing:.06em}
.brand img{width:52px;height:52px}
.badge{background:#fcee0a;color:#0b0b11;font:400 22px/1 "Bebas Neue";padding:5px 8px 2px;letter-spacing:.06em}
h1{margin:44px 0 0;font-size:92px;line-height:1.08;font-weight:900;letter-spacing:-.02em;text-shadow:.05em .05em 0 #fcee0a}
h1 em{font-style:normal;color:#fcee0a;text-shadow:.05em .05em 0 #fff}
p{margin:34px 0 0;font-size:25px;color:rgba(245,245,247,.78);line-height:1.5}
.r{position:absolute}
.r img{display:block;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.m{position:absolute;inset:-10px;background:linear-gradient(#fff,#fff) top left/16px 2px,linear-gradient(#fff,#fff) top left/2px 16px,linear-gradient(#fff,#fff) top right/16px 2px,linear-gradient(#fff,#fff) top right/2px 16px,linear-gradient(#fff,#fff) bottom left/16px 2px,linear-gradient(#fff,#fff) bottom left/2px 16px,linear-gradient(#fff,#fff) bottom right/16px 2px,linear-gradient(#fff,#fff) bottom right/2px 16px;background-repeat:no-repeat}
.lab{position:absolute;font:400 22px/1 "Bebas Neue";letter-spacing:.06em;color:#0b0b11;background:#fcee0a;padding:3px 6px 1px}
</style></head><body>
<div class="g"></div>
<svg class="b" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="34,0 100,0 100,100 8,100" fill="#fcee0a"/><line x1="30.4" y1="0" x2="4.4" y2="100" stroke="#fff" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>
<div class="dots"></div>
<div class="l">
  <div class="brand"><img src="http://127.0.0.1:8740/assets/icons/icon-192.png">SMEDCOVER</div>
  <h1>封面做<em>一次</em>，<br>尺寸<em>全出齐</em>。</h1>
  <p>品牌设好一次，每条视频选频道、写标题，<br>各平台要的尺寸一起出来。免费开源。</p>
</div>
<div class="r" style="left:690px;top:70px"><img src="http://127.0.0.1:8740/assets/img/hero/cel-16x9-sm.webp" width="430"><span class="m"></span><span class="lab" style="left:0;top:-30px">16:9</span></div>
<div class="r" style="left:720px;top:345px"><img src="http://127.0.0.1:8740/assets/img/hero/cel-3x4-sm.webp" width="165"><span class="m"></span><span class="lab" style="left:0;top:-30px">3:4</span></div>
<div class="r" style="left:925px;top:345px"><img src="http://127.0.0.1:8740/assets/img/hero/cel-9x16-sm.webp" width="124"><span class="m"></span><span class="lab" style="left:0;top:-30px">9:16</span></div>
<div class="r" style="left:1078px;top:345px"><img src="http://127.0.0.1:8740/assets/img/hero/cel-1x1-sm.webp" width="96"><span class="m"></span><span class="lab" style="left:0;top:-30px">1:1</span></div>
</body></html>
